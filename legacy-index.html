<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mechanical STL Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="control-panel" aria-label="Generator measurements">
        <a
          class="creator-card"
          href="https://www.facebook.com/CrankinCramers/"
          target="_blank"
          rel="noopener"
          aria-label="Open Crankin Cramer's on Facebook"
        >
          <span class="creator-avatar">
            <img
              src="https://graph.facebook.com/CrankinCramers/picture?type=large"
              alt="Crankin Cramer's Facebook profile"
              onerror="this.hidden = true"
            />
            <span class="creator-avatar-fallback">CC</span>
          </span>
          <span class="creator-copy">
            <span class="creator-kicker">Created by</span>
            <span class="creator-name">Crankin' Cramer's</span>
            <span class="creator-meta">19K followers on Facebook</span>
          </span>
        </a>

        <div class="title-block">
          <h1 id="projectTitle">Flat Belt Pulley</h1>
        </div>

        <form id="controls" class="controls"></form>

        <a
          id="primaryAffiliateCard"
          class="affiliate-card"
          href="https://amzn.to/3OBLLUC"
          target="_blank"
          rel="nofollow sponsored noopener"
          aria-label="Open belt fastener product link"
        >
          <img id="primaryAffiliateImage" src="belt lacing.png" alt="Belt lacing" />
          <span id="primaryAffiliateText">Belt fasteners</span>
        </a>

        <a
          id="secondaryAffiliateCard"
          class="affiliate-card"
          href="https://amzn.to/4tJgLkM"
          target="_blank"
          rel="nofollow sponsored noopener"
          aria-label="Open 2 inch wide flat belt product link"
        >
          <img id="secondaryAffiliateImage" src="2 inch wide flat belt.png" alt="2 inch wide flat belt" />
          <span id="secondaryAffiliateText">2 inch wide flat belt</span>
        </a>

        <div class="actions">
          <button id="downloadButton" class="primary-action" type="button">Download STL</button>
          <button id="resetButton" class="secondary-action" type="button">Reset</button>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </aside>

      <section class="preview-panel" aria-label="Model preview">
        <div class="preview-toolbar">
          <div>
            <p class="eyebrow">Preview</p>
            <h2 id="previewHeading">Mesh View</h2>
          </div>
          <nav class="project-switcher" aria-label="Project generators">
            <button class="project-button active" type="button" data-project-key="flatBeltPulley" data-project="Flat Belt Pulley" aria-current="page">
              Flat Belt Pulley
            </button>
            <button class="project-button" type="button" data-project-key="vBeltPulley" data-project="V-Belt Pulley">V-Belt Pulley</button>
            <button class="project-button" type="button" data-project-key="sprocket" data-project="Sprocket">Sprocket</button>
            <button class="project-button" type="button" data-project-key="straightCutGear" data-project="Straight Cut Gear">Straight Cut Gear</button>
            <button class="project-button" type="button" data-project-key="bevelGear" data-project="Bevel Gear">Bevel Gear</button>
            <button class="project-button" type="button" data-project-key="shaftSpacer" data-project="Shaft Spacer">Shaft Spacer</button>
            <button class="project-button" type="button" data-project-key="headGasket" data-project="Head Gasket">Head Gasket</button>
            <button class="project-button" type="button" data-project-key="ignitorGasket" data-project="Ignitor Gasket">Ignitor Gasket</button>
            <button class="project-button" type="button" data-project-key="dripOilerGasket" data-project="Drip Oiler Gasket">Drip Oiler Gasket</button>
          </nav>
          <div class="preview-info">
            <div id="metrics" class="metrics" aria-label="Derived measurements"></div>
            <div class="view-controls" aria-label="Preview view controls">
              <button id="zoomOutButton" type="button" title="Zoom out" aria-label="Zoom out">-</button>
              <button id="resetViewButton" type="button" title="Reset view" aria-label="Reset view">Fit</button>
              <button id="zoomInButton" type="button" title="Zoom in" aria-label="Zoom in">+</button>
            </div>
          </div>
        </div>
        <canvas id="previewCanvas" width="1200" height="800" aria-label="3D pulley preview"></canvas>
      </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/mesh-core.js"></script>
    <script src="js/generators.js"></script>
    <script src="js/geometry-helpers.js"></script>
    <script src="js/rim-primitives.js"></script>
    <script src="js/keyed-hub.js"></script>
    <script src="js/set-screw.js"></script>
    <script src="js/spokes.js"></script>
    <script src="js/sprocket.js"></script>
    <script src="js/straight-gear.js"></script>
    <script src="js/bevel-gear.js"></script>
    <script src="js/head-gasket.js"></script>
    <script src="js/ignitor-gasket.js"></script>
    <script src="js/drip-oiler-gasket.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/stl.js"></script>
    <script src="app.js"></script>
  </body>
</html>
