<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">U1 belt fasteners</title>
  <desc id="desc">Product-style illustration of metal conveyor belt fastener strips.</desc>
  <defs>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="0.32" stop-color="#bfc9c7"/>
      <stop offset="0.58" stop-color="#f3f6f6"/>
      <stop offset="1" stop-color="#8a9795"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#dfe7e6"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#3b4745" flood-opacity="0.22"/>
    </filter>
    <g id="coil">
      <path d="M0 0 C8 -12 18 -12 26 0 C34 12 44 12 52 0" fill="none" stroke="url(#metal)" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="strip">
      <rect x="-160" y="-22" width="320" height="44" rx="3" fill="url(#plate)" stroke="#9caaa8" stroke-width="2"/>
      <text x="0" y="7" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#2e78a4">U1 BELT FASTENER</text>
      <g transform="translate(-145,32)">
        <use href="#coil" x="0"/>
        <use href="#coil" x="28"/>
        <use href="#coil" x="56"/>
        <use href="#coil" x="84"/>
        <use href="#coil" x="112"/>
        <use href="#coil" x="140"/>
        <use href="#coil" x="168"/>
        <use href="#coil" x="196"/>
        <use href="#coil" x="224"/>
        <use href="#coil" x="252"/>
      </g>
      <g transform="translate(-145,-32) scale(1,-1)">
        <use href="#coil" x="0"/>
        <use href="#coil" x="28"/>
        <use href="#coil" x="56"/>
        <use href="#coil" x="84"/>
        <use href="#coil" x="112"/>
        <use href="#coil" x="140"/>
        <use href="#coil" x="168"/>
        <use href="#coil" x="196"/>
        <use href="#coil" x="224"/>
        <use href="#coil" x="252"/>
      </g>
    </g>
  </defs>
  <rect width="640" height="360" fill="#fff"/>
  <g filter="url(#shadow)">
    <g transform="translate(198 238) rotate(-20)">
      <use href="#strip"/>
    </g>
    <g transform="translate(418 214) rotate(18)">
      <use href="#strip"/>
    </g>
    <g transform="translate(330 118) rotate(8)">
      <use href="#strip"/>
    </g>
    <g transform="translate(156 88) rotate(18) scale(.82)">
      <use href="#strip"/>
    </g>
  </g>
  <g opacity=".62">
    <path d="M122 308 C188 260 246 246 318 276" fill="none" stroke="#d7dfdd" stroke-width="2"/>
    <path d="M430 78 C494 96 540 136 570 202" fill="none" stroke="#d7dfdd" stroke-width="2"/>
  </g>
</svg>
